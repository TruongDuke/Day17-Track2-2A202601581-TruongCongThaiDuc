version: 2

models:
  # --------------------------------------------------------------- tickets
  - name: silver_tickets
    description: "Trạng thái mới nhất của mỗi ticket, dựng từ CDC."

    # =====================================================================
    # NHIỆM VỤ 3 — phần cuối: bật contract và thêm test
    # =====================================================================
    # `contract` của dbt ràng buộc KIỂU dữ liệu: bật lên thì dbt kiểm tra
    # từng cột đúng data_type khai báo bên dưới, sai là dừng model.
    #
    # Nhưng contract KHÔNG ràng buộc MIỀN GIÁ TRỊ — nó vẫn cho priority = 99
    # đi qua, vì 99 đúng là integer. Miền giá trị là việc của test.
    # Cần cả hai.
    #
    # Việc của bạn:
    #   1. đổi enforced: false -> true
    #   2. bỏ comment khối tests: ở cột priority bên dưới và điền `values`
    config:
      contract:
        enforced: true

    columns:
      - name: ticket_id
        data_type: varchar
        description: "Khoá của entity ticket."
        tests: [unique, not_null]
      - name: customer_id
        data_type: varchar
      - name: customer_name
        data_type: varchar
      - name: segment
        data_type: varchar
      - name: priority
        data_type: integer
        description: "1 = urgent … 4 = low. Contract với team backend."
        # Contract ràng buộc KIỂU (integer); miền giá trị là việc của test.
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4]
              quote: false
      - name: category
        data_type: varchar
      - name: channel
        data_type: varchar
      - name: status
        data_type: varchar
      - name: csat
        data_type: integer
      - name: first_response_sec
        data_type: integer
      - name: subject
        data_type: varchar
      - name: body
        data_type: varchar
      - name: updated_at
        data_type: timestamp
      - name: _ingested_at
        data_type: timestamp

  # ----------------------------------------------------------- quarantine
  - name: quarantine_tickets
    description: >
      Bản ghi CDC bị contract từ chối. Grain: 1 hàng / 1 bản ghi CDC.
      Pipeline KHÔNG dừng khi gặp bản ghi lỗi — nó rơi vào đây.

  # ---------------------------------------------------------------- events
  - name: silver_events
    description: "Event runtime, đã dedup theo event_id."
    columns:
      - name: event_id
        tests: [unique, not_null]
      - name: event_date
        tests: [not_null]

  # ----------------------------------------------------------- transcripts
  - name: silver_transcripts
    description: "Hội thoại, đã dedup theo transcript_id."
    columns:
      - name: transcript_id
        tests: [unique, not_null]
